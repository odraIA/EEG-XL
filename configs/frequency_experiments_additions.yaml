    # broadband_megxl: original MEG-XL preprocessing band (0.1-40Hz).
    # fs50 is a deliberate anchor: it replicates meg-xl-med.ckpt's own
    # preprocessing exactly, and is Nyquist-violating by design (TFM sec 4.2)
    # -- it's also identical to this file's own top-level data.l_freq/h_freq/
    # target_sfreq defaults above.
    broadband_megxl_fs50:
      target_sfreq: 50.0
      l_freq: 0.1
      h_freq: 40.0
    broadband_megxl_fs100:
      target_sfreq: 100.0
      l_freq: 0.1
      h_freq: 40.0
    broadband_megxl_fs150:
      target_sfreq: 150.0
